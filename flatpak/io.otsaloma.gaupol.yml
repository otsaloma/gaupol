app-id: io.otsaloma.gaupol
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: gaupol
finish-args:
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-videos
  - --share=ipc
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
cleanup:
  - /include
  - /share/bash-completion
  - /share/doc
  - /share/fish
  - /share/gir-1.0
  - /share/man
  - /share/vala
  - /share/zsh
  - "*.la"
  - "*.a"
modules:

  # Spell-check

  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dsysprof=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b

  # Character encoding auto-detection

  # Generated with flatpak-pip-generator --runtime=org.gnome.Sdk//50 charset-normalizer -o python3-charset-normalizer --yaml
  - name: python3-charset-normalizer
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "charset-normalizer" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/bd/2a/23f34ec9d04624958e137efdc394888716353190e75f25dd22c7a2c7a8aa/charset_normalizer-3.4.9.tar.gz
        sha256: 673611bbd43f0810bec0b0f028ddeaaa501190339cac411f347ac76917c3ae7b

  # External video player: mpv

  - name: libass
    buildsystem: meson
    cleanup: ["*"]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
      - /lib/cmake
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: mpv
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # Gaupol

  - name: gaupol
    buildsystem: simple
    build-commands:
      - make PREFIX=/app build
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/otsaloma/gaupol.git
